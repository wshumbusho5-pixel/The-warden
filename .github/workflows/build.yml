name: build

# Triggers:
#   - Push a tag like v1.0.0 → builds Mac + Windows, attaches both to a Release.
#   - Manual "Run workflow" from the Actions tab → builds both, artifacts only.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write  # needed by softprops/action-gh-release on tag pushes

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Mac-only OCR + window APIs. Kept out of requirements.txt so
          # non-Mac installs don't try to resolve pyobjc wheels.
          pip install pyobjc-framework-Cocoa pyobjc-framework-Vision pyobjc-framework-Quartz
          pip install pyinstaller

      - name: Build TextKit.app
        run: pyinstaller TextKit.spec

      - name: Zip the .app
        # .app bundles are directories, so zip the whole thing for download.
        run: |
          cd dist
          zip -r TextKit-macOS.zip TextKit.app

      - uses: actions/upload-artifact@v4
        with:
          name: TextKit-macOS
          path: dist/TextKit-macOS.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TextKit-macOS.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build TextKit.exe
        run: pyinstaller TextKit.spec

      - name: Zip the folder
        # PyInstaller's non-onefile output is dist/TextKit/ with the .exe +
        # DLLs. Zip the folder so friends download a single file.
        run: Compress-Archive -Path dist/TextKit -DestinationPath dist/TextKit-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: TextKit-Windows
          path: dist/TextKit-Windows.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TextKit-Windows.zip
