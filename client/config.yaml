# Client Configuration

# Display Settings
display:
  # Default display mode (if no modifier is detected)
  # Options: 'client', 'server', 'both', 'silent'
  default_mode: 'client'

  # Show notifications when using server/silent mode
  show_mode_notifications: true

# Keyboard Settings
keyboard:
  # Type-only hotkey: focuses the overlay's input field. No screen capture,
  # no macOS recording indicator. Use this for asking questions directly.
  # 'ctrl+alt+s' is frequently grabbed by other apps on macOS; 'ctrl+alt+w'
  # ("Write") is freer and semantically matches the action.
  hotkey_question: 'ctrl+alt+w'

  # Capture hotkey: captures the screen + auto-asks "what's on my screen?".
  # Triggers macOS's screen-recording indicator (unavoidable). Use sparingly.
  hotkey_capture: 'ctrl+alt+a'

  # Voice hotkey: push-to-toggle voice input. First tap starts recording;
  # second tap stops, transcribes locally with Whisper, and fires a
  # normal question request with the transcript + a screen capture.
  hotkey_voice: 'ctrl+alt+v'

  # Legacy single-hotkey field (still read for back-compat).
  hotkey: 'ctrl+alt+a'

# Screen Capture Settings
screen_capture:
  # Enable screen capture and OCR
  enabled: true

  # Maximum characters to send from screen (to reduce API costs)
  max_characters: 2000

# Clipboard Settings
clipboard:
  # Enable clipboard context
  enabled: true

  # Maximum clipboard characters to send
  max_characters: 500

# Server Connection
server:
  # Server IP (override with MAIN_COMPUTER_IP env variable)
  # ip: 'localhost'

  # Server port
  port: 8765

  # Connection timeout (seconds)
  timeout: 10

# Privacy Settings
privacy:
  # Exclude these applications from screen capture
  excluded_apps:
    - 'Password Manager'
    - '1Password'
    - 'Bitwarden'
    - 'KeePass'

  # Patterns to exclude from screen text (regex)
  excluded_patterns:
    - 'password'
    - 'secret'
    - 'api[_-]?key'
    - 'token'

# Advanced Settings
advanced:
  # Enable debug logging
  debug: false

  # Log file location
  log_file: 'logs/client.log'
